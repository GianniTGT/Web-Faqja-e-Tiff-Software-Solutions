name: Build into the live branch

# Plesk (Git extension) pulls the branch `live` into /httpdocs. That branch holds only the
# built site — the contents of dist/ — never the source, because Plesk copies the repo as
# it is and the source is not a website. See CLAUDE.md §5a.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # An empty build pushed to `live` would be pulled by Plesk over a working site.
      - name: The build produced a site
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing — not publishing"; exit 1; }

      # One commit, force-pushed: `live` is a build output, not history. The source history
      # stays on main; the commit message names the source commit it was built from.
      - name: Push dist/ to the live branch
        run: |
          cd dist
          git init -q -b live
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" live

      # The GitHub webhook did not reliably make Plesk pull (12 October 2026: a manual «Pull»
      # was needed). So the workflow knocks on Plesk itself, after `live` is pushed. The URL
      # is the one Plesk shows under Git → «Webhook-URL», stored as a secret because it
      # carries Plesk's token. Without the secret this step does nothing.
      - name: Tell Plesk to pull
        env:
          PLESK_WEBHOOK_URL: ${{ secrets.PLESK_WEBHOOK_URL }}
        run: |
          if [ -z "$PLESK_WEBHOOK_URL" ]; then
            echo "::notice::PLESK_WEBHOOK_URL not set — Plesk must be pulled by hand."
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -d '{"ref":"refs/heads/live"}' "$PLESK_WEBHOOK_URL" >/dev/null
          echo "Plesk notified."
